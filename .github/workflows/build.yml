name: Build RICKIVERSE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.1'

      - name: Extraire le projet
        run: |
          unzip -oq Rickiverse-Forge-1.16.5-Source-FIX3.zip -d source

      - name: Verifier les fichiers
        run: |
          ls -la source
          test -f source/build.gradle
          test -f source/src/main/resources/META-INF/mods.toml

      - name: Compiler RICKIVERSE
        run: |
          cd source
          gradle clean build --no-daemon --stacktrace

      - name: Recuperer le JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RICKIVERSE-1.16.5
          path: source/build/libs/*.jar
          if-no-files-found: error
