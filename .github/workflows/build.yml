name: Build RICKIVERSE

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.1'

      - name: Clean ForgeGradle cache
        run: rm -rf "$HOME/.gradle/caches/forge_gradle"

      - name: Check configuration
        run: |
          java -version
          gradle --version
          echo "Fichiers présents à la racine :"
          ls -la
          echo "Recherche des fichiers Gradle :"
          find . -maxdepth 4 \( -name "build.gradle" -o -name "gradle.properties" -o -name "settings.gradle" \) -print

      - name: Compile RICKIVERSE
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rickiverse-Forge-1.16.5
          path: build/libs/*.jar
          if-no-files-found: error
