name: Build RICKIVERSE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extraire le projet
        run: |
          unzip -oq Rickiverse-Forge-1.16.5-Source.zip -d source

      - name: Installer Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-6.8.3-bin.zip
          unzip -q gradle-6.8.3-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-6.8.3/bin" >> "$GITHUB_PATH"

      - name: Compiler RICKIVERSE
        run: |
          cd source/rickiverse-1165
          gradle build --no-daemon

      - name: Télécharger le mod compilé
        uses: actions/upload-artifact@v4
        with:
          name: RICKIVERSE-1.16.5
          path: source/rickiverse-1165/build/libs/*.jar
