name: Build RICKIVERSE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extraire le projet
        run: |
          unzip -q Rickiverse-Forge-1.16.5-Source.zip -d source
          find source -maxdepth 3 -type f | head -50

      - name: Compiler le mod
        run: |
          cd source
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publier le résultat
        uses: actions/upload-artifact@v4
        with:
          name: Rickiverse-Minecraft-1.16.5-Forge
          path: source/build/libs/*.jar
